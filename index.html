<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Certificat CAPS</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f2f2f2;
    font-family: Arial, sans-serif;
}

.certificate{
    position:relative;
    width:1000px;
    height:700px;
    background:url("certificat.svg") no-repeat center;
    background-size:contain;
}

.name{
    position:absolute;
    top:360px;   /* ← on ajustera ensemble */
    left:50%;
    transform:translateX(-50%);
    font-size:36px;
    font-family:"Times New Roman", serif;
}

button{
    position:absolute;
    bottom:-80px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 22px;
    font-size:16px;
    border:none;
    background:#5f007f;
    color:white;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="certificate">
    <div id="studentName" class="name"></div>
    <button onclick="generate()">Générer mon certificat</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
function generate(){

    const nom = prompt("Entrez votre nom et prénom");

    if(!nom || nom.trim()===""){
        alert("Nom requis");
        return;
    }

    document.getElementById("studentName").innerText = nom;

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF("landscape","mm","a4");

    const img = new Image();
    img.src = "certificat.svg";

    img.onload = function(){

        doc.addImage(img, "SVG", 0, 0, 297, 210);

        doc.setFont("times","normal");
        doc.setFontSize(22);

        doc.text(nom, 148.5, 92, {align:"center"}); 
        /* ← position du nom dans le PDF
           on ajustera ensemble */

        doc.save("certificat.pdf");
    }
}
</script>

</body>
</html>
