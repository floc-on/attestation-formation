<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Générateur de certificat</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .box {
      text-align: center;
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

    button {
      padding: 12px 22px;
      font-size: 16px;
      border: none;
      background: #5f007f;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #4a0063;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Générer mon certificat</h1>
    <button id="generateBtn">Télécharger le certificat</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    async function imageToDataUrl(path) {
      const response = await fetch(path);
      if (!response.ok) {
        throw new Error("Impossible de charger l'image de fond : " + path);
      }

      const blob = await response.blob();

      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    document.getElementById("generateBtn").addEventListener("click", async () => {
      const nom = prompt("Entrez votre nom et prénom :");

      if (!nom || !nom.trim()) {
        alert("Le nom et prénom sont requis.");
        return;
      }

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
          orientation: "landscape",
          unit: "mm",
          format: "a4"
        });

        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();

        const background = await imageToDataUrl("certificat.png");

        doc.addImage(background, "PNG", 0, 0, pageWidth, pageHeight);

        doc.setFont("times", "normal");
        doc.setFontSize(24);

        const xCentre = pageWidth / 2;

        /* 
          Ajuste seulement cette ligne si le nom est trop haut ou trop bas.
          0.44 = 44% de la hauteur de page
        */
        const yNom = pageHeight * 0.44;

        doc.text(nom.trim(), xCentre, yNom, { align: "center" });

        const nomFichier = "certificat-" + nom.trim().replace(/\s+/g, "_") + ".pdf";
        doc.save(nomFichier);

      } catch (error) {
        console.error(error);
        alert("Le PDF n'a pas pu être généré. Vérifiez que le fichier certificat.png est bien présent dans le repository.");
      }
    });
  </script>
</body>
</html>
